<!doctype html>
<meta name="referrer" content="strict-origin-when-cross-origin">
<iframe id="player" width="100%" height="315" frameborder="0" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
const id = new URLSearchParams(location.search).get("id");
document.getElementById("player").src =
  "https://www.youtube.com/embed/" + encodeURIComponent(id) +
  "?autoplay=1&loop=1&mute=1&cc_load_policy=1&playlist=" + encodeURIComponent(id);
</script>
